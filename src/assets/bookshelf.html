<script>
/* ============================================================
   Colorfigures core: projection, shapes, shading, ink, labels, page shell.
   A figure page includes this file (scripts/build.py inlines it), then calls mountFigure({...}).
   See SKILL.md for the drawing contract and conventions.
   One fixed view (front-left-top) and one fixed light (from above, behind the viewer's right shoulder: the front is lit,
   the left side is in shade, and cast shadows fall toward the lower left of the screen).
   ============================================================ */

/* ---------- palettes ---------- */
const PALS = {
  mustard: { l:'#f4b829', m:'#d49c1f', d:'#4e4a18' },
  tomato:  { l:'#ef6a4c', m:'#cf5038', d:'#4a2219' },
  mint:    { l:'#93d3b0', m:'#71b693', d:'#1f4034' },
  cobalt:  { l:'#76a0e2', m:'#5a82c6', d:'#1c2948' },
  blush:   { l:'#f3a6bb', m:'#d8869c', d:'#4b2430' },
};
const METAL   = { l:'#eef0f0', m:'#c6ccce', d:'#8f989b' };
const CLEAR   = { l:'#e4f2f4', m:'#c4dfe4', d:'#97b9c0' };
const CERAMIC = { l:'#fbfaf3', m:'#e3e0d2', d:'#bdb8a6' };
const DARK    = { l:'#55504a', m:'#3d3935', d:'#272421' };
const INK = '#231e16';
const SHADOW = '#41538f';

/* ---------- projection (x = depth toward viewer-right, y = toward viewer-left, z = up) ---------- */
const C = Math.cos(Math.PI/6), S = Math.sin(Math.PI/6);
let OX = 0, OY = 0;
/* VIEW turns the object in 90° steps about a vertical axis through its centre (RC):
   0 = front (+x) and left (+y) faces toward the viewer, 1 = turned once (the +y side becomes the front)…
   Figures keep modelling in their own coordinates; P / Dv / vis / tone / depthOf all apply the turn. */
let VIEW = 0, RC = [0, 0];
const VIEW_NAMES = ['front', 'left side', 'back', 'right side'];
const TURNS = [0, 2];                 // the views the UI offers: front and back (figures still draw correctly in all four)
const rotV = ([x,y,z]) => { switch (VIEW & 3){ case 1: return [y,-x,z]; case 2: return [-x,-y,z]; case 3: return [-y,x,z]; default: return [x,y,z]; } };
const rotXY = (x,y) => { const r = rotV([x-RC[0], y-RC[1], 0]); return [r[0]+RC[0], r[1]+RC[1]]; };
const P0 = (x,y,z) => [(x-y)*C + OX, (x+y)*S - z + OY];                       // raw iso, no turn
const P  = (x,y,z) => { const [a,b] = rotXY(x,y); return [(a-b)*C + OX, (a+b)*S - z + OY]; };
const Dv = (x,y,z) => { const [a,b,c] = rotV([x,y,z]); return [(a-b)*C, (a+b)*S - c]; };
// distance toward the viewer in the current view: draw parts with smaller depth first
const depthOf = p => { const [a,b] = rotXY(p[0],p[1]); return a + b + p[2]; };
// sort [{at:[x,y,z], svg}] back-to-front for the current view and join
const byDepth = parts => parts.filter(Boolean).sort((p,q) => depthOf(p.at) - depthOf(q.at)).map(p => p.svg).join('');
const f  = v => v.toFixed(1);
const pd = (pts, close=true) => 'M' + pts.map(p => { const q = P(p[0],p[1],p[2]); return f(q[0])+' '+f(q[1]); }).join('L') + (close ? 'Z' : '');
const sp = pts => 'M' + pts.map(q => f(q[0])+' '+f(q[1])).join('L') + 'Z';

/* ---------- 2D shapes in a plane's (u,v) coords (v up), mapped to 3D by a plane ---------- */
const arcUV  = (cu,cv,r,a0,a1,n=7) => { const o=[]; for (let i=0;i<=n;i++){ const a=(a0+(a1-a0)*i/n)*Math.PI/180; o.push([cu+r*Math.cos(a), cv+r*Math.sin(a)]); } return o; };
const rrUV   = (u0,v0,u1,v1,r,n=7) => r <= 0 ? rectUV(u0,v0,u1,v1) : [...arcUV(u1-r,v0+r,r,-90,0,n), ...arcUV(u1-r,v1-r,r,0,90,n), ...arcUV(u0+r,v1-r,r,90,180,n), ...arcUV(u0+r,v0+r,r,180,270,n)];
const rectUV = (u0,v0,u1,v1) => [[u0,v0],[u1,v0],[u1,v1],[u0,v1]];
const ellUV  = (cu,cv,ru,rv,n=24) => Array.from({length:n}, (_,i) => { const a=i/n*2*Math.PI; return [cu+ru*Math.cos(a), cv+rv*Math.sin(a)]; });
const PX = x => ([u,v]) => [x,u,v];      // front-facing plane x = const   (u = y, v = z)
const PY = y => ([u,v]) => [u,y,v];      // side plane y = const           (u = x, v = z)
const PZ = z => ([u,v]) => [u,v,z];      // horizontal plane z = const     (u = x, v = y)
const on = (plane, uv) => uv.map(plane);

/* ---------- vectors + shading ---------- */
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]], dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
const norm=a=>{ const l=Math.hypot(...a)||1; return a.map(v=>v/l); };
const avg=ps=>ps.reduce((s,p)=>[s[0]+p[0]/ps.length,s[1]+p[1]/ps.length,s[2]+p[2]/ps.length],[0,0,0]);
const vis = n => { const r = rotV(n); return r[0]+r[1]+r[2] > 1e-6; };   // viewer looks from (+1,+1,+1) after the turn
const facing = vis;                                                       // readable alias: is this face toward the viewer?
const SHADOW_K = 0.85, AZ_MIN = 20, AZ_MAX = 160;
// cast shadows are drawn shorter than the shading light implies (0.45 × height instead of 0.85 ×): long shadows of tall
// parts on thin supports (a lamp shade, a fan head) land far from the object and read as separate blobs
const SHADOW_LEN = 0.45;
let L = [0,0,1], SH = [0,0];
function setLight(deg){ const a=deg*Math.PI/180; SH=[SHADOW_K*Math.cos(a), SHADOW_K*Math.sin(a)]; L=norm([-SH[0],-SH[1],1]); }
const LIN = norm([.6,.2,1]);                       // fixed light for interiors / small props
const tone  = (n,m) => { const d=dot(rotV(n),L);   return d>-.15 ? m.l : d>-.45 ? m.m : m.d; };   // exterior, follows the sun
const toneI = (n,m) => { const d=dot(rotV(n),LIN); return d>.6 ? m.l : d>.05 ? m.m : m.d; };      // interior / props
const mix = (a,b,t) => '#' + [1,3,5].map(i => Math.round(parseInt(a.substr(i,2),16)*(1-t) + parseInt(b.substr(i,2),16)*t).toString(16).padStart(2,'0')).join('');
const matOf = hex => ({ l:hex, m:mix(hex,'#000000',.16), d:mix(hex,'#000000',.42) });
const ease = t => t<.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;

/* ---------- drawing primitives (all return SVG strings) ---------- */
const ink   = (d,w=1.0) => `<path d="${d}" fill="none" stroke="${INK}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"/>`;
const fill  = (d,c,extra='') => `<path d="${d}" fill="${c}" ${extra}/>`;
const face  = (d,c) => `<path d="${d}" fill="${c}" stroke="${c}" stroke-width=".7" stroke-linejoin="round"/>`;
const shape = (pts,c,w=.9) => fill(pd(pts),c) + (w ? ink(pd(pts),w) : '');
const line  = (pts,w=.9) => ink(pd(pts,false),w);
// Loft between two rings of equal length (closed). colour(n) picks each strip's fill; flip = seen from inside.
function loft(A, B, colour, flip=false){
  const n=A.length, cen=avg(A.concat(B)); let s='';
  for (let i=0;i<n;i++){
    const a0=A[i], a1=A[(i+1)%n], b1=B[(i+1)%n], b0=B[i];
    let nr = norm(cross(sub(a1,a0), sub(b0,a0)));
    if (!isFinite(nr[0])) continue;
    if (dot(nr, sub(avg([a0,a1,b1,b0]), cen)) < 0) nr = nr.map(v=>-v);
    if (flip) nr = nr.map(v=>-v);
    if (vis(nr)) s += face(pd([a0,a1,b1,b0]), colour(nr));
  }
  return s;
}
function hull(pts){
  pts = pts.slice().sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
  const cr=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]); const lo=[], up=[];
  for (const p of pts){ while(lo.length>=2 && cr(lo[lo.length-2],lo[lo.length-1],p)<=0) lo.pop(); lo.push(p); }
  for (const p of pts.reverse()){ while(up.length>=2 && cr(up[up.length-2],up[up.length-1],p)<=0) up.pop(); up.push(p); }
  lo.pop(); up.pop(); return lo.concat(up);
}
// Silhouette ink, weighted by how thick the part is on screen (like a hand inker): the w you pass is the most it gets.
// Thickness = 2 × area / perimeter of the outline (a rod's diameter, about half a box's width), as a share of the
// frame width. A long thin rod, a handle or a knob stays light (~1–1.5); a grinder, kettle or machine body gets the
// heavy ~2.4–2.8. Thin parts stay thin and parts keep air between them.
const hullInk = (pts3, w=1.4) => { const h = hull(pts3.map(p=>P(...p))); let a = 0, per = 0;
  for (let i = 0; i < h.length; i++){ const p = h[i], q = h[(i+1) % h.length]; a += p[0]*q[1] - q[0]*p[1]; per += Math.hypot(q[0]-p[0], q[1]-p[1]); }
  const thick = per ? Math.abs(a) / per / (INK_K * INK_REF_VB) : 0;
  return ink(sp(h), Math.min(w, .9 + 20*thick)); };
// Axis-aligned box: three visible faces, shaded, each outlined. shade = tone (sunlit) or toneI (interior).
function box(x0,y0,z0,x1,y1,z1,m,shade=toneI,w=.9){
  // all six faces, drawn only when they face the viewer (sides first, then top) — correct in every VIEW
  const F = [

      for (const c of b.choices(st)){ const ch = document.createElement('button'); ch.className = 'chip' + (c.current ? ' current' : c.disabled ? ' off' : ''); ch.textContent = c.label;
        if (c.current) ch.setAttribute('aria-pressed', 'true');
        ch.onclick = ev => { ev.stopPropagation(); closeChips();
          if (c.current) return ui.flash(`${c.label} — already set`);
          if (c.disabled) return ui.flash(c.why || `${c.label} isn't possible right now`);
          c.onClick(st, ui); ui.render(); }; chips.appendChild(ch); }
      wrap.classList.add('open'); };
  });
  function closeChips(){ document.querySelectorAll('.stepwrap.open').forEach(w => w.classList.remove('open')); }
  document.addEventListener('click', closeChips);

  document.getElementById('wb').oninput = e => document.getElementById('wob').setAttribute('scale', (e.target.value * INK_K).toFixed(2));
  const pals = document.getElementById('pals');
  for (const [k,p] of Object.entries(PALS)){
    const b = document.createElement('button'); b.className='sw'; b.title=k; b.style.background=p.l; b.setAttribute('aria-pressed', k===st.pal);
    b.onclick = () => { st.pal=k; [...pals.children].forEach(c=>c.setAttribute('aria-pressed', c===b)); ui.render(); };
    pals.appendChild(b);
  }
  // labels: the switch appears when the figure draws any tag(); ?labels=0 starts with them hidden
  const lblctl = document.getElementById('lblctl'), lbl = document.getElementById('lbl');
  const setLabels = on => { document.documentElement.classList.toggle('nolabels', !on); lbl.textContent = on ? 'On' : 'Off'; lbl.setAttribute('aria-pressed', on); };
  lbl.onclick = () => setLabels(document.documentElement.classList.contains('nolabels'));
  if (q.get('labels') === '0') setLabels(false);
  // testing: ?press=Label@ms,Label@ms clicks the buttons whose text starts with Label at those times after load
  // (any order, repeats allowed); Label>Choice picks a choice from a picker button (?press=Speed>3@300).
  // Script errors and unknown labels are recorded on <html data-errors="…">
  window.__st = st;
  const noteErr = m => { document.documentElement.dataset.errors = (document.documentElement.dataset.errors || '') + ' ' + m + ';'; };
  const starts = (el, t) => el.textContent.trim().toLowerCase().startsWith(t.trim().toLowerCase());
  if (q.has('press')) q.get('press').split(',').forEach(item => { const [what, ms] = item.split('@'), [label, choice] = what.split('>');
    setTimeout(() => { const b = [...document.querySelectorAll('.act')].find(b => starts(b, label));
      if (!b) return noteErr(`no button "${label}"`);
      b.click(); if (choice == null) return;
      const c = [...b.parentElement.querySelectorAll('.chip')].find(c => starts(c, choice));
      if (c && !c.disabled) c.click(); else noteErr(`no choice "${choice}" in "${label}"`); }, +ms || 0); });
  setLight(st.az); ui.render();
  if (art.querySelector('.tag')) lblctl.hidden = false;
  return ui;
}

  const glint = (at, x, a, b) => line([at(x, ...a), at(x, ...b)], .3).replace(INK, '#ffffff');
  // robot-only details (drawn while that part is still at rest in robot form)
  const robotDec = {
    shin0:() => QXR(.92, -1.45, 2.0, -.5, 2.7, OP_GREY.l),
    shin1:() => QXR(.92, .5, 2.0, 1.45, 2.7, OP_GREY.l) + wheel(atR, -.05, 1.67, 1.45, .6),
    pelvis:() => QXR(.92, -.45, 3.65, .45, 4.25, OP_BLUE.l),
    torso:() => { const fx = 1.22; let s = QXR(fx, .25, 5.95, 1.8, 7.1, OP_GLASS) + QXR(fx, -1.8, 5.95, -.25, 7.1, OP_GLASS)
        + glint(atR, fx + .01, [.5, 6.95], [1.0, 6.25]) + glint(atR, fx + .01, [-1.55, 6.95], [-1.05, 6.25]) + QXR(fx, -.95, 4.45, .95, 5.75, OP_GREY.l);
      for (const y of [-.57, -.19, .19, .57]) s += LXR(fx + .01, [y, 4.6], [y, 5.6], .3); return s; },
    head:() => { const hx = 1.27; let s = QXR(hx, -1.0, 8.6, 1.0, 9.3, '#3d4650') + QXR(hx, .15, 8.8, .8, 9.15, '#7fe0ff', .3) + QXR(hx, -.8, 8.8, -.15, 9.15, '#7fe0ff', .3)
        + QXR(hx, -.9, 7.6, .9, 8.6, OP_GREY.l);
      for (const y of [-.3, .3]) s += LXR(hx + .01, [y, 7.7], [y, 8.5], .3);
      return s + shape([atR(hx, -.32, 9.3), atR(hx, .32, 9.3), atR(hx, .12, 10.0), atR(hx, -.12, 10.0)], OP_GREY.l, .4); },
  };
  // truck-only details: windscreen, grille, headlights, side window
  const truckDec = {
    torso:() => { const fx = 3.41; let s = QXT(fx, .2, 3.15, 1.5, 4.15, OP_GLASS) + QXT(fx, -1.5, 3.15, -.2, 4.15, OP_GLASS)
        + glint(atT, fx + .01, [.45, 4.0], [.85, 3.4]) + glint(atT, fx + .01, [-1.25, 4.0], [-.85, 3.4])
        + QXT(fx, -.95, 1.2, .95, 2.85, OP_GREY.l) + QXT(fx, 1.15, 1.45, 1.55, 1.95, '#ffd75a', .35) + QXT(fx, -1.55, 1.45, -1.15, 1.95, '#ffd75a', .35)
        + QYT(1.71, 1.1, 3.15, 2.5, 4.15, OP_GLASS);
      for (const y of [-.57, -.19, .19, .57]) s += LXT(fx + .01, [y, 1.35], [y, 2.7], .3); return s; },
  };
  const items = [];
  for (const pt of OP_PARTS){
    const q = opEase((T - pt.d) / .7), qy = opEase(q * 2), qx = opEase(q * 2 - 1);
    if (pt.ot === 2 && q > .9) continue;                                   // folded away inside the cab
    const L = (i, w) => pt.r[i] + (pt.t[i] - pt.r[i]) * w;
    const b = [L(0, qx), L(1, qy), L(2, q), L(3, qx), L(4, qy), L(5, q)];
    if (pt.ot === 2){ const c = [(b[0] + b[3]) / 2, (b[1] + b[4]) / 2, (b[2] + b[5]) / 2], k = 1 - q * .5; for (let i = 0; i < 3; i++){ b[i] = c[i] + (b[i] - c[i]) * k; b[i + 3] = c[i] + (b[i + 3] - c[i]) * k; } }
    let svg;
    if (!pt.m){ // smokestack
      const a = atR(b[0], b[1], b[2]), e = atR(b[3], b[4], b[5]);
      svg = rod(a, e, .22, METAL, toneI, .6) + rod(e, [e[0], e[1], e[2] + .25], .3, METAL, toneI, .5);
    } else svg = box(...atR(b[0], b[1], b[2]), ...atR(b[3], b[4], b[5]), pt.m, toneI, .6);
    if (pt.k.startsWith('ear') && q < .5){ const yy = pt.k === 'ear1' ? 1.52 : -1.52, z1 = b[5] + 1.5 * (1 - q * 2);
      const ant = rod(atR(.05, yy + (b[1] - pt.r[1]), b[5]), atR(.05, yy + (b[1] - pt.r[1]), z1), .09, METAL, toneI, .5);
      svg = pt.k === 'ear1' ? svg + ant : ant + svg; }
    if (q <= 0 && robotDec[pt.k]) svg += robotDec[pt.k]();
    if (q >= 1 && truckDec[pt.k]) svg += truckDec[pt.k]();
    items.push({ o:truckOrder ? pt.ot : pt.or, svg, b });
  }
  // the truck's wheels roll out in the second half
  const wr = .7 * opEase((T - .55) / .35);
  if (wr > .05){ for (const x of [2.4, -1.6, -2.9]){ items.push({ o:.5, svg:wheel(atT, x, -1.72, .7, wr), b:null }); items.push({ o:18, svg:wheel(atT, x, 1.72, .7, wr), b:null }); } }
  items.sort((a, c) => a.o - c.o);
  const pts = []; for (const it of items) if (it.b) for (const x of [it.b[0], it.b[3]]) for (const y of [it.b[1], it.b[4]]) for (const z of [it.b[2], it.b[5]]) pts.push(atR(x, y, z));
  return { svg:act('optimus', items.map(it => it.svg).join('')), pts };
}

/* ---------- a little note tucked under 无人生还: tap it and it pops up ---------- */
const NOTE_PAPER = '#fff3b8', NOTE_TO = [106, 31], NOTE_TXT = ['最伟大的', '推理作品！！！'];
function noteSlip(y, part){
  const { x1, fz } = SHF;
  if (part === 'floor') return shape([[15.8, y - 1.2, fz + .03], [x1, y - 1.75, fz + .03], [x1, y + 1.4, fz + .03], [15.8, y + 1.45, fz + .03]], NOTE_PAPER, .5);
  const X = x1 + .04;
  return shape([[X, y - 1.75, fz], [X, y + 1.4, fz], [X, y + 1.3, fz - 1.3], [X, y - 1.7, fz - 1.2]], NOTE_PAPER, .55)
    + line([[X + .02, y - 1.25, fz - .4], [X + .02, y + .9, fz - .45]], .3).replace(INK, '#d0453a')
    + line([[X + .02, y - 1.25, fz - .8], [X + .02, y + .4, fz - .82]], .3).replace(INK, '#d0453a');
}
function noteXf(st){
  const q = ease(st.note), y = shelfPose(st, 1).c[1], a = P(SHF.x1, y, SHF.fz - .5);
  const cx = a[0] + (NOTE_TO[0] - a[0]) * q, cy = a[1] + (NOTE_TO[1] - a[1]) * q - Math.sin(q * Math.PI) * 8;
  return `translate(${f(cx)} ${f(cy)}) rotate(${f(24 - 28 * q)}) scale(${f(.04 + .74 * q)})`;
}
function noteCard(st){
  if (st.note <= .001) return '';
  const R = (x0, y0, x1, y1) => `M${x0} ${y0}L${x1} ${y0}L${x1} ${y1}L${x0} ${y1}Z`;
  const body = 'M-25 -15L25 -15L25 10L20 15L-25 15Z';
  let o = `<path d="${R(-24, -13.5, 26.5, 17)}" fill="#3a2a14" opacity=".14"/>`;
  o += fill(body, NOTE_PAPER) + `<path d="M25 10L20 10L20 15Z" fill="#e8d78f"/>` + ink(body, 1.1) + ink('M25 10L20 10L20 15', .8);
  for (const yy of [-.6, 10.2]) o += `<path d="M-21 ${yy}L18 ${yy}" stroke="#a9c0e3" stroke-width=".9" fill="none"/>`;
  o += `<path d="M-21 -15L-21 15" stroke="#e7a0a0" stroke-width=".7" fill="none"/>`;
  o += `<g transform="rotate(3)"><path d="${R(-8, -18, 8, -12.5)}" fill="#f3dc9a" opacity=".85"/></g>`;

}
function noteText(st){
  if (st.note < .6) return '';

  const op = Math.min(1, (st.note - .6) / .3).toFixed(2);
  return `<g pointer-events="none" opacity="${op}" transform="${noteXf(st)}">`
    + `<text x="-2" y="-2.2" font-size="7.4" text-anchor="middle" rotate="${wob(NOTE_TXT[0], 1, 6)}" ${pen}>${NOTE_TXT[0]}</text>`
    + `<text x="2.2" y="8.6" font-size="7.2" text-anchor="middle" rotate="${wob(NOTE_TXT[1], 9, 6)}" ${pen}>${NOTE_TXT[1].replace(/([！!]+)$/, '<tspan dx="-2.4" letter-spacing="-3.2">$1</tspan>')}</text>`
    + `<path d="M-19 11.6q2.2 -1.4 4.4 0t4.4 0t4.4 0t4.4 0t4.4 0t4.4 0t4.4 0" stroke="#d0453a" stroke-width=".55" fill="none" stroke-linecap="round"/></g>`;

/* ---------- scene ---------- */
function plantSvg(){
  const { x, y } = PLANT, z = SHF.z1;
  let s = cyl(x, y, z, z + 3.6, 2.3, CERAMIC, toneI, 1.1);
  s += fill(pd(on(PZ(z + 3.4), ellUV(x, y, 1.8, 1.8, 18))), '#6b4a32');
  const leaves = [0, 72, 144, 216, 288].map((deg, k) => { const a = (deg + 20) * Math.PI / 180, L2 = k % 2 ? 4.2 : 5;
    const b = [x, y, z + 3.4], tip = [x + Math.cos(a) * L2 * .7, y + Math.sin(a) * L2 * .7, z + 3.4 + L2 * 1.05];
    const mid = lerp3(b, tip, .5), sd = [-Math.sin(a) * 1, Math.cos(a) * 1, 0];
    const pts = [b, add3(mid, sd), tip, add3(mid, mul3(sd, -1))];
    return { at:tip, svg:shape(pts, k % 2 ? '#7fbf6a' : '#5f9e57', .8) + line([b, tip], .5) }; });
  return s + byDepth(leaves);
}
function plantPts(){ const { x, y } = PLANT, z = SHF.z1; return [...on(PZ(z), ellUV(x, y, 2.3, 2.3, 10)), ...on(PZ(z + 3.6), ellUV(x, y, 2.3, 2.3, 10)), [x, y, z + 8.5]]; }
function mangaLowPose(k){ const bk = BOOKS[4]; return { c:[MANGA.x + MANGA.low[k].dx, MANGA.y - bk.d / 2, SHF.z1 + bk.t * (k + .5) + .05 * k], s:[0, 1, 0], u:[-1, 0, 0] }; }

function scene(st, m){
  const sideC = m.m, frontC = m.l, topC = mix(m.l, '#ffffff', .12);
  let s = board(0, 0, BW, BD, Z0, 4, BOARDC);
  // which book is where
  const mv = st.mv, outI = st.out;
  const away = mv ? mv.i : outI;          // the book not standing in its slot
  const sl = slots(st.order);
  // cast shadows on the board
  const shelfC = []; for (const x of [SHF.x0, SHF.x1]) for (const y of [SHF.y0, SHF.y1]) for (const z of [Z0, SHF.z1]) shelfC.push([x, y, z]);
  s += castShadow(shelfC, Z0, BTOP);
  let flyer = null;                        // the book drawn in front of everything
  if (mv && mv.p > SPLIT){ const F = transitPose(st, mv.i, mv.p); flyer = { i:mv.i, F, phi:0 };
    s += `<g opacity=".5">${castShadow(bookCorners(BOOKS[mv.i], F), Z0, BTOP)}</g>`; }
  else if (!mv && outI != null){ const F = readPose(outI), phi = ease(st.open) * OPEN_MAX; flyer = { i:outI, F, phi, reader:true };
    s += castShadow(bookCorners(BOOKS[outI], F, phi), Z0, BTOP); }
  // inside the shelf (seen through the open front)
  const { x0, x1, y0, y1, w, fz, iz, z1, back } = SHF;
  let inside = shape([[back, y0 + w, fz], [back, y1 - w, fz], [back, y1 - w, iz], [back, y0 + w, iz]], CREAM.m, .8);
  inside += fill(pd([[back, y0 + w, iz - 2.2], [back, y1 - w, iz - 2.2], [back, y1 - w, iz], [back, y0 + w, iz]]), mix(CREAM.m, CREAM.d, .5));
  inside += shape([[back, y0 + w, fz], [x1, y0 + w, fz], [x1, y0 + w, iz], [back, y0 + w, iz]], CREAM.d, .8);
  inside += shape([[back, y0 + w, fz], [x1, y0 + w, fz], [x1, y1 - w, fz], [back, y1 - w, fz]], CREAM.l, .8);
  const noteY = shelfPose(st, 1).c[1];
  inside += act('note', noteSlip(noteY, 'floor'));
  const parts = [], outParts = [];
  for (const i of st.order){
    if (i === away && !(mv && mv.p <= SPLIT)) continue;
    const bk = BOOKS[i], F = (mv && mv.i === i) ? transitPose(st, i, mv.p) : shelfPose(st, i);
    const front = F.c[0] + bk.d / 2, cut = x1 - F.c[0];
    const dat = `data-i="${i}"`;
    if (front > x1 + .01){
      parts.push({ at:F.c, svg:act('book', bookSvg(bk, F, 0, { a1:cut }), dat) });
      outParts.push({ at:F.c, svg:act('book', bookSvg(bk, F, 0, { a0:cut }), dat) });
    } else parts.push({ at:F.c, svg:act('book', bookSvg(bk, F), dat) });
  }
  // bookend at the end of the row
  const ye = sl.end;
  parts.push({ at:[11, ye - .3, fz + 5], svg:box(6.5, ye - .55, fz, 15.5, ye - .15, fz + 10.5, METAL, toneI, .8) + box(6.5, ye - .55 - 4, fz, 15.5, ye - .15, fz + .25, METAL, toneI, .6) });
  inside += byDepth(parts);
  s += clipTo(OPEN3, inside);
  // shelf body: front frame with the opening, top, left side, silhouette
  const outerF = on(PX(x1), rectUV(y0, Z0, y1, z1));
  s += `<path d="${pd(outerF)}${pd(OPEN3)}" fill="${frontC}" fill-rule="evenodd"/>` + ink(pd(outerF), 1.6) + ink(pd(OPEN3), 1.5);
  s += shape(TOP3, topC, 1.2);
  s += shape([[x0, y1, Z0], [x1, y1, Z0], [x1, y1, z1], [x0, y1, z1]], sideC, 1.2);
  s += line([[x1, y0, Z0 + .01], [x1, y1, Z0 + .01]], .9);
  s += hullInk(shelfC, 2.6);
  s += act('note', noteSlip(noteY, 'lip'));

  s += byDepth(outParts);
  // on top: shadows, the manga stack and the plant
  const mF = [mangaLowPose(0), mangaLowPose(1)], mk = BOOKS[4];
  const mangaHere = away !== 4 || (mv && mv.i === 4 && mv.p <= SPLIT);
  const stackPts = [...mF.flatMap(F => bookCorners(mk, F))];
  if (away !== 4) stackPts.push(...bookCorners(mk, shelfPose(st, 4)));
  s += clipTo(TOP3, castShadow(stackPts, SHF.z1) + castShadow(plantPts(), SHF.z1));
  let stack = mF.map((F, k) => act('book', bookSvg({ ...mk, col:MANGA.low[k].col }, F, 0, { col:MANGA.low[k].col, vol:MANGA.low[k].vol, spine:'电锯人' + MANGA.low[k].vol }), 'data-i="4"')).join('');
  if (mangaHere){ const F = (mv && mv.i === 4) ? transitPose(st, 4, mv.p) : shelfPose(st, 4); stack += act('book', bookSvg(mk, F, 0, { spine:'电锯人1' }), 'data-i="4"'); }
  s += byDepth([{ at:[MANGA.x, MANGA.y - 6, SHF.z1 + 3], svg:stack }, { at:[PLANT.x, PLANT.y, SHF.z1 + 3], svg:plantSvg() }]);
  // the book in the air, or on the board being read

  // the little Optimus Prime stands nearest the viewer
  const op = optimusParts(st);
  s += castShadow(op.pts, Z0, BTOP) + op.svg;

/* ---------- page text: drawn crisp (outside the hand-drawn filter) on top of the open book ---------- */
function pageText(st){
  if (st.mv || st.out == null || st.open < .85) return '';
  const bk = BOOKS[st.out], F = readPose(st.out), { t, h, d } = bk, ct = .35, phi = ease(st.open) * OPEN_MAX;
  const s = F.s, u = F.u, fr = norm(cross(s, u)), c = F.c, eT = t / 2 - ct;
  const dir = add3(mul3(s, -Math.cos(phi)), mul3(fr, Math.sin(phi))), nn = add3(mul3(fr, Math.cos(phi)), mul3(s, Math.sin(phi)));
  const Hg = add3(c, mul3(s, d / 2), mul3(fr, eT));
  const LP = (x, b) => add3(Hg, mul3(dir, d - x), mul3(u, b - h / 2), mul3(nn, -.04));      // left page = inside of the cover
  const RP = (x, b) => add3(c, mul3(s, d / 2 - x), mul3(u, b - h / 2), mul3(fr, eT + .04));  // right page = first page
  const dn = mul3(u, -1); let o = '';

  const per = bk.cn.length <= 5 ? bk.cn.length : Math.ceil(bk.cn.length / 2), lines = wrapCJK(bk.cn, per), ts = Math.min(2.3, (d - 3) / per);
  let b = h - 3 - ts * .8;
  lines.forEach((ln, k) => { o += handTx(LP(d / 2, b), mul3(dir, -1), dn, ln, ts * 1.08, '#231e16', 'middle', k * 7); b -= ts * 1.3; });
  o += `<path d="${pd([LP(d / 2 - 2, b + ts * .55), LP(d / 2 + 2, b + ts * .55)], false)}" stroke="${bk.col === '#f1dfae' ? bk.acc : bk.col}" stroke-width=".35" fill="none"/>`;
  b -= 1.4;
  o += handTx(LP(d / 2, b), mul3(dir, -1), dn, bk.au, Math.min(1.6, (d - 2.4) / bk.au.length * 1.2), '#4a4136', 'middle', 3);
  o += handTx(LP(d / 2, 2.2), mul3(dir, -1), dn, `${bk.yr} · ${bk.genre}`, 1.4, '#857d6e', 'middle', 5);
  // right: a line or two from the book, as big as fits
  let sz = 2.1, wr; const qt = '「' + bk.quote + '」';
  for (; sz > 1.1; sz -= .05){ const pr = Math.floor((d - 3.0) / (sz * 1.12)); wr = wrapCJK(qt, pr); if (wr.length * sz * 1.5 <= h - 6) break; }
  let bb = h - 3 - sz * .8;
  wr.forEach((ln, k) => { o += handTx(RP(1.3 + (k % 2) * .15, bb), mul3(s, -1), dn, ln, sz * 1.05, '#2a2218', 'start', 11 + k * 5); bb -= sz * 1.5; });
  o += handTx(RP(d / 2, 1.6), mul3(s, -1), dn, '1', 1.3, '#857d6e', 'middle', 2);
  return `<g pointer-events="none" opacity="${Math.min(1, (st.open - .85) / .1).toFixed(2)}">${o}</g>`;
}

/* ---------- actions ---------- */
let ui, running = false;
const isBusy = st => !!(st.mv || st.sortA || st.wig || st.open !== st.openT);
function wake(){ if (running) return; running = true; ui.animate(dt => { const more = step(ui.st, dt); if (!more) running = false; return more; }); }
function step(st, dt){
  if (st.open !== st.openT){ const k = dt / .75; st.open = st.openT > st.open ? Math.min(st.openT, st.open + k) : Math.max(st.openT, st.open - k);
    if (st.open === st.openT && st.onOpen){ const cb = st.onOpen; st.onOpen = null; cb(); } }
  if (st.mv){ const M = st.mv; M.p += M.dir * dt / 1.7;
    if (M.dir > 0 && M.p >= 1){ st.mv = null; st.out = M.i; st.openT = 1; if (M.done) M.done(); }
    else if (M.dir < 0 && M.p <= 0){ st.mv = null; if (M.done) M.done(); } }
  if (st.sortA){ st.sortA.p += dt / 1.2; if (st.sortA.p >= 1) st.sortA = null; }
  if (st.wig){ const W = st.wig; W.t += dt;
    if (W.t * W.rate >= W.steps + .35){ st.wig = null; ui.flash(`推荐你读：《${BOOKS[W.pick].cn}》`, 2200); doPick(st, W.pick); } }
  if (!isBusy(st) && st.want != null){ const w = st.want; st.want = null; doPick(st, w); }
  return isBusy(st);
}
function fetchBook(st, i){ st.mv = { i, p:0, dir:1 }; }
function returnBook(st, cb){
  const go = () => { const i = st.out; st.out = null; st.mv = { i, p:1, dir:-1, done:cb }; };
  if (st.open > 0 || st.openT > 0){ st.openT = 0; st.onOpen = go; } else go();
}
function doPick(st, i){
  if (st.out === i){ if (st.openT === 0){ st.openT = 1; wake(); } else ui.flash(`正在看《${BOOKS[i].cn}》`); return; }
  if (st.out != null){ returnBook(st, () => fetchBook(st, i)); } else fetchBook(st, i);
  wake();
}
function pickBook(st, i){
  if (isBusy(st)){ st.want = i; wake(); return ui.flash(`好的，接下来拿《${BOOKS[i].cn}》`, 1800); }
  st.want = null;
  if (st.out != null && st.out !== i) ui.flash(`先把《${BOOKS[st.out].short}》放回去…`, 1600);
  doPick(st, i);
}
function toggleOpen(st){
  if (st.mv && st.mv.dir > 0) return ui.flash('书拿过来就会翻开');
  if (st.mv) return ui.flash('书正在放回架子');
  if (st.out == null) return ui.flash('先抽一本书吧');
  st.openT = st.openT ? 0 : 1; st.onOpen = null; wake();
}
function putBack(st){
  if (st.mv && st.mv.dir > 0){ st.mv.dir = -1; st.mv.done = null; st.want = null; wake(); return ui.flash('好，不看了，放回去'); }
  if (st.mv) return ui.flash('正在放回去');
  if (st.out == null) return ui.flash('书都在架子上');
  st.want = null; returnBook(st, null); wake();
}
function recommend(st){
  if (st.mv || st.sortA || st.wig) return ui.flash('等书架停下来再推荐');
  const pool = BOOKS.map((_, i) => i).filter(i => i !== st.out);
  const pick = pool[Math.floor(Math.random() * pool.length)];
  const seq = [...st.order, 4].filter(i => i !== st.out);
  st.wig = { t:0, rate:9, seq, pick, steps:seq.length + seq.indexOf(pick) + 1 }; wake();
}
const hue = hex => { const [r, g, b] = [1, 3, 5].map(k => parseInt(hex.substr(k, 2), 16) / 255), mx = Math.max(r, g, b), mn = Math.min(r, g, b), dd = mx - mn;
  if (dd < .08) return 400 + (1 - mx) * 10;
  let hh = mx === r ? ((g - b) / dd) % 6 : mx === g ? (b - r) / dd + 2 : (r - g) / dd + 4; return (hh * 60 + 360 + 20) % 360; };
const GENRES = ['推理', '文学', '奇幻', '漫画'];
const SORTS = [
  { k:'default', label:'默认顺序', fn:() => START_ORDER.slice() },
  { k:'color', label:'按颜色', fn:() => START_ORDER.slice().sort((a, b) => hue(BOOKS[a].col) - hue(BOOKS[b].col)) },
  { k:'author', label:'按作者 A–Z', fn:() => START_ORDER.slice().sort((a, b) => BOOKS[a].key.localeCompare(BOOKS[b].key)) },
  { k:'year', label:'按年份', fn:() => START_ORDER.slice().sort((a, b) => BOOKS[a].yr - BOOKS[b].yr) },
  { k:'genre', label:'按类型', fn:() => START_ORDER.slice().sort((a, b) => GENRES.indexOf(BOOKS[a].genre) - GENRES.indexOf(BOOKS[b].genre) || BOOKS[a].yr - BOOKS[b].yr) },
];
function sortBy(st, k){
  const S2 = SORTS.find(x => x.k === k), from = slots(st.order), order = S2.fn(), to = slots(order);
  st.sortKey = k; st.order = order; st.sortA = { from, to, p:0 }; wake();
}

ui = mountFigure({
  fig:'08', title:'Bookshelf 小书架', hint:'抽一本书 → 翻开 → 放回去',
  size:[BW, BD, 41], palette:'orange',
  state:{ tf:0, tfT:0, note:0, noteT:0, order:START_ORDER.slice(), sortKey:'default', mv:null, out:null, open:0, openT:0, onOpen:null, sortA:null, wig:null, want:null },
  scene,
  buttonsLabel:'书架',
  buttons:[
    { label:'抽一本书', choices: st => BOOKS.map((b, i) => ({ label:`${b.short} · ${b.au}`, current: st.out === i && !st.mv, onClick:(st) => pickBook(st, i) })) },
    { label:'翻开 / 合上', onClick:(st) => toggleOpen(st) },
    { label:'放回去', onClick:(st) => putBack(st) },
    { label:'随机推荐', onClick:(st) => recommend(st) },
    { label:'整理书架', choices: st => SORTS.map(x => ({ label:x.label, current: st.sortKey === x.k,
        disabled: !!(st.mv || st.wig || st.sortA), why:'等书放好了再整理', onClick:(st) => sortBy(st, x.k) })) },
  ],
  stats: st => [{ label:'书架上', value:`${8 - (st.out != null || st.mv ? 1 : 0)} 本` },
                { label:'正在看', value: st.out != null && !st.mv ? BOOKS[st.out].short : '—', small:true }],
  acts:{
    book:(st, el) => pickBook(st, +el.dataset.i),
    reader:(st) => toggleOpen(st),
    note:(st) => { const was = st.note !== st.noteT; st.noteT = st.noteT ? 0 : 1;
      if (!was) ui.animate(dt => { const d = st.noteT - st.note; st.note += Math.sign(d) * Math.min(Math.abs(d), dt / .55); return st.note !== st.noteT; }); },
    optimus:(st) => { const was = st.tf !== st.tfT; st.tfT = st.tfT ? 0 : 1; ui.flash(st.tfT ? '汽车人，变形！' : '变回机器人！', 1400);
      if (!was) ui.animate(dt => { const d = st.tfT - st.tf, s2 = Math.sign(d) * Math.min(Math.abs(d), dt / 1.5); st.tf += s2; return st.tf !== st.tfT; }); },
  },
  params:(st, q) => {
    if (q.has('sort')){ const S2 = SORTS.find(x => x.k === q.get('sort')); if (S2){ st.sortKey = S2.k; st.order = S2.fn(); } }
    if (q.has('note')) st.note = st.noteT = +q.get('note');
    if (q.has('truck')) st.tf = st.tfT = +q.get('truck');
    if (q.has('out')){ st.out = +q.get('out'); st.open = st.openT = q.get('open') === '0' ? 0 : 1; }
    if (q.has('mv')) st.mv = { i:+q.get('mv'), p:+(q.get('p') || .5), dir:1, frozen:true };
    if (q.has('wig')) st.wig = { t:+q.get('wig'), rate:0, seq:[...st.order, 4], pick:0, steps:99, w:+q.get('wig') };
  },
});
document.documentElement.style.setProperty('--paper', '#f7f1e3');
(() => { const svg = document.getElementById('fig'), g = document.createElementNS('http://www.w3.org/2000/svg', 'g'); g.id = 'crisp'; svg.appendChild(g);
  const r0 = ui.render; ui.render = () => { r0(); g.innerHTML = pageText(ui.st) + noteText(ui.st); }; ui.render(); })();
</script></body></html>
